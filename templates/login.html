<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERP Flota PRO - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #111827,
                #1e3a8a
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {

            width: 350px;
            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.25);
        }

        h2 {

            margin-top: 0;

            text-align: center;

            color: #111827;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 8px;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <form
        method="POST"
        action="/login"
        class="box"
    >

        <h2>🚛 ERP Flota PRO</h2>

        <div class="subtitle">
            Sistema de control de flota
        </div>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <input
            name="username"
            placeholder="Usuario"
            autocomplete="username"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

</body>

</html>
