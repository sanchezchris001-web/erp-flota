<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ERP Flota PRO - Login</title>

<style>

*{
    box-sizing:border-box;
}

body{

    font-family:
        'Segoe UI',
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1e3a8a
        );

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    margin:0;

    padding:20px;

}

.box{

    background:white;

    color:#111827;

    padding:35px;

    border-radius:18px;

    width:100%;

    max-width:360px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

}

.logo{

    text-align:center;

    font-size:26px;

    font-weight:bold;

    margin-bottom:5px;

}

.subtitle{

    text-align:center;

    color:#6b7280;

    margin-bottom:25px;

}

label{

    display:block;

    font-size:14px;

    font-weight:600;

    margin-top:12px;

}

input{

    width:100%;

    padding:11px;

    margin-top:5px;

    border:1px solid #d1d5db;

    border-radius:8px;

    outline:none;

}

input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.1);

}

button{

    width:100%;

    padding:12px;

    margin-top:20px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

.error{

    color:#991b1b;

    background:#fee2e2;

    border-radius:8px;

    padding:10px;

    font-size:14px;

}

.footer{

    text-align:center;

    color:#9ca3af;

    font-size:12px;

    margin-top:20px;

}

</style>

</head>


<body>


<form
    method="POST"
    class="box"
>


<div class="logo">

    🚛 ERP Flota PRO

</div>


<div class="subtitle">

    Sistema de gestión de flota

</div>


{% if error %}

<div class="error">

    {{ error }}

</div>

{% endif %}


<label for="username">

    Usuario

</label>

<input
    id="username"
    name="username"
    type="text"
    placeholder="Ingrese su usuario"
    autocomplete="username"
    required
>


<label for="password">

    Contraseña

</label>

<input
    id="password"
    name="password"
    type="password"
    placeholder="Ingrese su contraseña"
    autocomplete="current-password"
    required
>


<button type="submit">

    Ingresar

</button>


<div class="footer">

    ERP Flota PRO

</div>


</form>


</body>

</html>
