services:
  - type: web
    name: erp-flota
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-flota-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: erp-flota-db